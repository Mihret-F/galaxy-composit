<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">No Image Available</title>
  <desc id="desc">A neutral placeholder graphic for products without uploaded photos.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f5f5f5"/>
      <stop offset="100%" stop-color="#e5e7eb"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <g fill="none" stroke="#d1d5db" stroke-width="10">
    <rect x="240" y="150" width="720" height="600" rx="28"/>
    <circle cx="600" cy="420" r="120" stroke="#cbd5e1"/>
    <path d="M390 620 L510 490 L630 610 L700 560 L810 620" stroke="#cbd5e1" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="600" y="760" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="700" fill="#6b7280" letter-spacing="2">NO IMAGE</text>
</svg>
